name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    # The package has no dependencies, so there is nothing to install and no
    # lockfile to cache. Every job below runs against the source as published.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['20.x', '22.x']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Offline test suite
        run: npm test
      - name: Packaged contents and documentation contract
        run: npm run verify:package
      - name: Examples and templates
        run: npm run verify:examples

      # On a failure, re-run the CLI suite with the TAP reporter for names and
      # stacks. Deliberately NOT `node --test`: that runs the file in a child
      # process which talks to the runner over stdout, and this suite patches
      # process.stdout while the CLI under test runs. The two cannot coexist.
      - name: Name the failures
        if: failure()
        run: node --test-reporter=tap test/cli.test.js
