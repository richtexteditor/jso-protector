name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    # The package has no dependencies, so there is nothing to install and no
    # lockfile to cache. Every job below runs against the source as published.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['20.x', '22.x']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Offline test suite
        run: npm test
      - name: Packaged contents and documentation contract
        run: npm run verify:package
      - name: Examples and templates
        run: npm run verify:examples

      # TAP hides which subtest failed once GitHub collapses the log, and the
      # suite runs each file directly rather than through `node --test`. On a
      # failure, re-run the CLI suite with the spec reporter so the next person
      # reading this gets names and stacks instead of a count.
      - name: Name the failures
        if: failure()
        run: node --test --test-reporter=spec test/cli.test.js
