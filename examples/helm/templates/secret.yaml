{{- /*
   Only emit a Secret when the user did NOT supply an existingSecret.
   stringData lets the values stay readable in the manifest; Kubernetes
   base64-encodes them on apply.
*/ -}}
{{- if not .Values.credentials.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "jso-protector.secretName" . }}
  labels:
    {{- include "jso-protector.labels" . | nindent 4 }}
type: Opaque
stringData:
  JSO_API_KEY: {{ required "credentials.apiKey is required when credentials.existingSecret is empty" .Values.credentials.apiKey | quote }}
  JSO_API_PASSWORD: {{ required "credentials.apiPassword is required when credentials.existingSecret is empty" .Values.credentials.apiPassword | quote }}
{{- end }}
